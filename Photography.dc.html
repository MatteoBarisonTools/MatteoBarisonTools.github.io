<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  galleries = {
    warmNature: [
      'Photography_media/Warm Nature/IMG_1759.jpg',
      'Photography_media/Warm Nature/IMG_2195.jpg',
      'Photography_media/Warm Nature/IMG_2248.jpg',
      'Photography_media/Warm Nature/IMG_2408.jpg',
      'Photography_media/Warm Nature/IMG_2429.jpg',
      'Photography_media/Warm Nature/IMG_2519.jpg',
      'Photography_media/Warm Nature/IMG_2682.jpg',
      'Photography_media/Warm Nature/IMG_2689.jpg',
      'Photography_media/Warm Nature/IMG_2736.jpg',
      'Photography_media/Warm Nature/IMG_2739.jpg',
      'Photography_media/Warm Nature/IMG_2921.jpg',
      'Photography_media/Warm Nature/IMG_2932.jpg',
      'Photography_media/Warm Nature/IMG_3288.jpg',
      'Photography_media/Warm Nature/IMG_3292.jpg',
      'Photography_media/Warm Nature/IMG_3297.jpg',
      'Photography_media/Warm Nature/IMG_3324.jpg',
      'Photography_media/Warm Nature/IMG_3900.jpg'
    ],
    animals: [
      'Photography_media/Animals/DSC_0445.jpg',
      'Photography_media/Animals/DSC_0456.jpg',
      'Photography_media/Animals/IMG_2217.jpg',
      'Photography_media/Animals/IMG_2264.jpg',
      'Photography_media/Animals/IMG_2364-Enhanced-NR.jpg',
      'Photography_media/Animals/IMG_4313.jpg',
      'Photography_media/Animals/IMG_4358.jpg',
      'Photography_media/Animals/IMG_4392.jpg',
      'Photography_media/Animals/IMG_4632.jpg',
      'Photography_media/Animals/Still 2026-05-10 133233_1.3.1.jpg',
      'Photography_media/Animals/Still 2026-05-10 133233_1.3.5.jpg',
      'Photography_media/Animals/fsfsfs.jpg'
    ],
    outdoor: [
      'Photography_media/Outdoor/BarisonMatteo_Composition_01_edit.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Composition_02_edit.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Composition_03_edit.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Exposure_01_edit.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Exposure_03_edit.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Extra_01.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Extra_08.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Extra_09.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Extra_11.jpg',
      'Photography_media/Outdoor/BarisonMatteo_Extra_14.jpg',
      'Photography_media/Outdoor/IMG_4161.jpg',
      'Photography_media/Outdoor/IMG_4501.jpg'
    ],
    studio: [
      'Photography_media/Studio/Studio_00.jpg',
      'Photography_media/Studio/Studio_01.jpg',
      'Photography_media/Studio/Studio_02.jpg',
      'Photography_media/Studio/Studio_03.jpg',
      'Photography_media/Studio/Studio_04.jpg',
      'Photography_media/Studio/Studio_05.jpg'
    ]
  };

  state = {
    lightboxOpen: false,
    lightboxGallery: null,
    lightboxIndex: 0
  };

  componentDidMount() {
    this._onKey = (e) => {
      if (!this.state.lightboxOpen) return;
      if (e.key === 'Escape') this.setState({ lightboxOpen: false });
      if (e.key === 'ArrowRight') this._navigate(1);
      if (e.key === 'ArrowLeft') this._navigate(-1);
    };
    document.addEventListener('keydown', this._onKey);
    this._blockContext = (e) => { if (e.target.closest('img')) e.preventDefault(); };
    document.addEventListener('contextmenu', this._blockContext);
  }

  componentWillUnmount() {
    document.removeEventListener('keydown', this._onKey);
    document.removeEventListener('contextmenu', this._blockContext);
  }

  _navigate(dir) {
    const gallery = this.galleries[this.state.lightboxGallery];
    if (!gallery) return;
    let idx = this.state.lightboxIndex + dir;
    if (idx < 0) idx = gallery.length - 1;
    if (idx >= gallery.length) idx = 0;
    this.setState({ lightboxIndex: idx });
  }

  _makeItems(galleryKey) {
    return this.galleries[galleryKey].map((src, i) => ({
      src,
      open: () => this.setState({ lightboxOpen: true, lightboxGallery: galleryKey, lightboxIndex: i })
    }));
  }

  renderVals() {
    const gal = this.state.lightboxGallery;
    const idx = this.state.lightboxIndex;
    const currentSrc = gal && this.galleries[gal] ? this.galleries[gal][idx] || '' : '';

    return {
      warmNature: this._makeItems('warmNature'),
      animals: this._makeItems('animals'),
      outdoor: this._makeItems('outdoor'),
      studio: this._makeItems('studio'),
      lightboxOpen: this.state.lightboxOpen,
      lightboxSrc: currentSrc,
      closeLightbox: () => this.setState({ lightboxOpen: false }),
      stopPropagation: (e) => e.stopPropagation(),
      prevPhoto: () => this._navigate(-1),
      nextPhoto: () => this._navigate(1)
    };
  }
}
</script>

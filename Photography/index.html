    a { color: var(--color-accent); }
    a:hover { color: var(--color-accent-700); }

    .cover-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: var(--space-4);

    @media (max-width: 540px) {

      transition: transform 0.4s ease; will-change: transform;
    }
    .cover-label {

    .cover-label span {
      color: rgba(255,255,255,0.7); font-size: 13px;

    /* Full-bleed slideshow */
    .slideshow {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--color-bg);
      display: flex; flex-direction: column;
    }
    .ss-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) clamp(20px, 5vw, 64px);
      border-bottom: 1px solid var(--color-divider);
      flex-shrink: 0; position: relative;
    }
    .ss-back {
      display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer; background: none;
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-md);
      color: var(--color-accent); font-family: var(--font-heading);
      font-weight: var(--font-heading-weight); font-size: 13px;
      padding: 6px 14px 6px 10px;
      transition: background 0.15s, color 0.15s;
    }
    .ss-back svg { flex-shrink: 0; }
    .ss-back:hover {
      background: color-mix(in srgb, var(--color-accent) 12%, transparent);
      color: var(--color-accent-700);
    }
    .ss-title {
      font-family: var(--font-heading); font-weight: var(--font-heading-weight);
      font-size: 16px; color: var(--color-text);
      position: absolute; left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }
    .ss-counter {
      font-size: 13px; color: rgba(255,255,255,0.5);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 600px) {
      .ss-title { display: none; }
    }
    .ss-stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; padding: var(--space-4);
      min-height: 0;
    }
    .ss-stage img {
      max-width: 100%; max-height: 100%; object-fit: contain; display: block;
    }
    .ss-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08); color: var(--color-text); border: none;
      width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px); font-size: 22px;
      transition: background 0.15s;
    }
    .ss-nav:hover { background: rgba(255,255,255,0.16); }
    .ss-prev { left: clamp(12px, 3vw, 32px); }
    .ss-next { right: clamp(12px, 3vw, 32px); }
    @media (max-width: 600px) {
      .ss-nav { width: 38px; height: 38px; font-size: 18px; }
    }

    /* Thumbnail strip */
    .ss-thumbs {
      flex-shrink: 0; border-top: 1px solid var(--color-divider);
      padding: var(--space-3) clamp(20px, 5vw, 64px);
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--color-neutral-400) transparent;
    }
    .ss-thumbs::-webkit-scrollbar { height: 6px; }
    .ss-thumbs::-webkit-scrollbar-track { background: transparent; }
    .ss-thumbs::-webkit-scrollbar-thumb { background: var(--color-neutral-400); border-radius: 3px; }
    .ss-thumb-row {
      display: flex; gap: 8px;
      width: max-content;
    }
    .ss-thumb {
      width: 72px; height: 72px; flex-shrink: 0;
      border-radius: var(--radius-sm); overflow: hidden;
      cursor: pointer; border: 2px solid transparent;
      opacity: 0.5; transition: opacity 0.15s, border-color 0.15s;
    }
    .ss-thumb:hover { opacity: 0.85; }
    .ss-thumb.active {
      opacity: 1; border-color: var(--color-accent);
    }
    .ss-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    @media (max-width: 600px) {
      .ss-thumb { width: 56px; height: 56px; }
    }
  </style>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  galleryData = [];

  state = {
    openGallery: null,
    ssIndex: 0
  };

  componentDidMount() {
    // Load gallery data from manifest (loaded via <script> tag)
    const data = window.PHOTOGRAPHY_MANIFEST || [];
    this.galleryData = data.map(g => ({
      key: g.title.toLowerCase().replace(/\s+/g, '-'),
      title: g.title,
      cover: g.folder + '/' + g.cover,
      photos: g.photos.map(p => g.folder + '/' + p)
    }));

    this._onKey = (e) => {
      if (!this.state.openGallery) return;
      if (e.key === 'Escape') this.setState({ openGallery: null });
      if (e.key === 'ArrowRight') this._navigate(1);
      if (e.key === 'ArrowLeft') this._navigate(-1);
    };
    document.addEventListener('keydown', this._onKey);
    this._blockContext = (e) => { if (e.target.closest('img')) e.preventDefault(); };
    document.addEventListener('contextmenu', this._blockContext);

    // Parallax on cover cards — event delegation so it works after render
    this._onCoverMove = (e) => {
      const card = e.target.closest('.cover-card');
      if (!card) return;
      const img = card.querySelector('img');
      if (!img) return;
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      img.style.transition = 'transform 0.15s ease-out';
      img.style.transform = 'scale(1.08) translate(' + (x * -20) + 'px,' + (y * -20) + 'px)';
    };
    this._onCoverOut = (e) => {
      const card = e.target.closest('.cover-card');
      if (!card || card.contains(e.relatedTarget)) return;
      const img = card.querySelector('img');
      if (img) { img.style.transition = 'transform 0.4s ease'; img.style.transform = ''; }
    };
    document.addEventListener('mousemove', this._onCoverMove);
    document.addEventListener('mouseout', this._onCoverOut);
  }

  componentWillUnmount() {
    document.removeEventListener('keydown', this._onKey);
    document.removeEventListener('contextmenu', this._blockContext);
    document.removeEventListener('mousemove', this._onCoverMove);
    document.removeEventListener('mouseout', this._onCoverOut);
  }

  _getOpen() {
    return this.galleryData.find(g => g.key === this.state.openGallery);
  }

  _navigate(dir) {
    const gal = this._getOpen();
    if (!gal) return;
    let idx = this.state.ssIndex + dir;
    if (idx < 0) idx = gal.photos.length - 1;
    if (idx >= gal.photos.length) idx = 0;
    this.setState({ ssIndex: idx });
    this._scrollThumb(idx);
  }

  _scrollThumb(idx) {
    requestAnimationFrame(() => {
      const strip = document.getElementById('ss-thumbs');
      if (!strip) return;
      const el = strip.querySelector('[data-thumb-idx="' + idx + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }

  renderVals() {
    const openGal = this._getOpen();

    const covers = this.galleryData.map(g => ({
      src: g.cover,
      title: g.title,
      count: g.photos.length,
      open: () => this.setState({ openGallery: g.key, ssIndex: 0 })
    }));

    const ssSrc = openGal ? openGal.photos[this.state.ssIndex] || '' : '';
    const ssTotal = openGal ? openGal.photos.length : 0;

    const thumbs = openGal ? openGal.photos.map((src, i) => ({
      src,
      idx: i,
      cls: i === this.state.ssIndex ? 'active' : '',
      go: () => this.setState({ ssIndex: i })
    })) : [];

    return {
      covers,
      slideshowOpen: !!this.state.openGallery,
      ssTitle: openGal ? openGal.title : '',
      ssSrc,
      ssPosition: openGal ? (this.state.ssIndex + 1) + ' / ' + ssTotal : '',
      thumbs,
      closeSlideshow: () => this.setState({ openGallery: null }),
      ssPrev: () => this._navigate(-1),
      ssNext: () => this._navigate(1)
    };
  }
}
</script>
